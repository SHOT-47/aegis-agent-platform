[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-storage",
    "crates/aegis-policy",
    "crates/aegis-events",
    "crates/aegis-indexing",
    "crates/aegis-context",
    "crates/aegis-models",
    "crates/aegis-browser",
    "crates/aegis-extensibility",
    "crates/aegis-harness",
    "crates/aegis-server-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Aegis Autonomous Agent Engineering"]
repository = "https://github.com/aegis-agent/aegis"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = "0.24"
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
